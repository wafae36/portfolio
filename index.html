<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio Wafae Boutarfa</title>
<meta name="description" content="Portfolio de Wafae Boutarfa, élève ingénieure en IA & Data Science à l’EMSI Rabat. Projets, stages et compétences.">
<meta property="og:type" content="website">
<meta property="og:title" content="Portfolio Wafae Boutarfa">
<meta property="og:description" content="Élève ingénieure en IA & Data Science. Projets, stages et compétences.">
<meta property="og:site_name" content="Portfolio Wafae Boutarfa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FB; --surface:#FFFFFF; --ink:#0F1B2D; --text:#3A4658; --muted:#667388; --line:#DCE3EE;
  --pri:#2456E6; --pri-ink:#FFFFFF; --aqua:#0B9C8B; --soft:#E8EEFD; --shadow:0 20px 44px -24px rgba(20,45,110,.35);
  --display:"Bricolage Grotesque","Trebuchet MS",Verdana,sans-serif; --body:"Figtree","Segoe UI",Helvetica,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0A1120; --surface:#111B2F; --ink:#F1F5FB; --text:#C3CCDA; --muted:#8E9AAE; --line:#22304A; --pri:#7AA2FF; --pri-ink:#0A1120; --aqua:#3DD9C5; --soft:#16233D; --shadow:0 20px 44px -24px rgba(0,0,0,.8); }
}
:root[data-theme="dark"]{ --bg:#0A1120; --surface:#111B2F; --ink:#F1F5FB; --text:#C3CCDA; --muted:#8E9AAE; --line:#22304A; --pri:#7AA2FF; --pri-ink:#0A1120; --aqua:#3DD9C5; --soft:#16233D; --shadow:0 20px 44px -24px rgba(0,0,0,.8); }
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth; scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--body); font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased; transition:background .4s ease, color .4s ease}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display); color:var(--ink); line-height:1.12; letter-spacing:-.01em}
a{color:var(--pri)}
:focus-visible{outline:3px solid var(--pri); outline-offset:3px; border-radius:6px}
.wrap{max-width:1160px; margin:0 auto; padding:0 24px}
section{padding:96px 0 0}

/* Nav */
.nav{position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
.nav .wrap{display:flex; align-items:center; gap:14px; min-height:66px}
.brand{font-family:var(--display); font-weight:800; font-size:20px; color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:8px; white-space:nowrap}
.brand i{width:10px; height:10px; border-radius:50%; background:var(--aqua); animation:pulse 2.4s ease-in-out infinite}
.links{display:flex; gap:2px; margin-left:auto}
.links a{color:var(--text); text-decoration:none; font-weight:500; font-size:15px; padding:8px 12px; border-radius:999px; transition:background .25s, color .25s}
.links a:hover{background:var(--soft); color:var(--ink)}
.links a.on{background:var(--ink); color:var(--bg)}
.tools{display:flex; align-items:center; gap:8px}
.seg{display:flex; border:1px solid var(--line); border-radius:999px; padding:3px; background:var(--surface)}
.seg button{font:inherit; font-size:13px; font-weight:700; border:0; background:transparent; color:var(--muted); padding:5px 11px; border-radius:999px; cursor:pointer; transition:background .25s, color .25s}
.seg button[aria-pressed="true"]{background:var(--pri); color:var(--pri-ink)}
.iconbtn{width:38px; height:38px; display:grid; place-items:center; border-radius:50%; border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; transition:transform .4s, border-color .25s}
.iconbtn:hover{transform:rotate(25deg); border-color:var(--pri)}
.burger{display:none}

/* Hero */
.hero{padding:64px 0 0; overflow:hidden}
.hero .wrap{display:grid; grid-template-columns:1.25fr .75fr; gap:56px; align-items:center}
.avail{display:inline-flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 16px 7px 12px; font-size:14px; font-weight:600; color:var(--ink)}
.avail i{width:9px; height:9px; border-radius:50%; background:var(--aqua); box-shadow:0 0 0 0 var(--aqua); animation:ping 2s ease-out infinite}
.hero h1{font-size:clamp(2.7rem, 7.2vw, 5.4rem); font-weight:800; margin-top:22px}
.hero h1 small{display:block; font-family:var(--body); font-size:clamp(1rem,1.6vw,1.2rem); font-weight:500; color:var(--muted); letter-spacing:0; margin-bottom:6px}
.role{font-family:var(--display); font-weight:500; font-size:clamp(1.2rem,2.4vw,1.7rem); color:var(--pri); margin-top:14px}
.lead{margin-top:18px; font-size:1.1rem; max-width:34em; min-height:3.4em}
.rot{display:inline-block; color:var(--ink); font-weight:700; background:linear-gradient(transparent 62%, color-mix(in srgb, var(--aqua) 40%, transparent) 62%); animation:swap .5s ease both}
.cta{display:flex; flex-wrap:wrap; gap:12px; margin-top:28px}
.btn{display:inline-flex; align-items:center; gap:10px; font:inherit; font-size:15.5px; font-weight:700; padding:13px 24px; border-radius:14px; text-decoration:none; border:2px solid var(--pri); cursor:pointer; transition:transform .25s, box-shadow .25s, background .25s, color .25s}
.btn.solid{background:var(--pri); color:var(--pri-ink)}
.btn.line{background:transparent; color:var(--pri)}
.btn:hover{transform:translateY(-3px); box-shadow:var(--shadow)}
.btn.line:hover{background:var(--soft)}
.photo{position:relative; justify-self:center; width:min(320px,100%)}
.photo::before{content:""; position:absolute; inset:0; border-radius:34px; background:linear-gradient(140deg,var(--pri),var(--aqua)); transform:rotate(-6deg) translate(-10px,10px); opacity:.9; transition:transform .6s}
.photo:hover::before{transform:rotate(-2deg) translate(-4px,4px)}
.photo img{position:relative; display:block; width:100%; aspect-ratio:1; object-fit:cover; border-radius:34px; border:5px solid var(--surface)}
.tag{position:absolute; z-index:2; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:14px; padding:9px 14px; font-size:13.5px; font-weight:700; color:var(--ink); animation:float 4s ease-in-out infinite}
.tag.a{left:-26px; top:26px} .tag.b{right:-18px; bottom:30px; animation-delay:-2s}
.tag span{display:block; font-weight:500; color:var(--muted); font-size:12.5px}
.a1{animation:rise .8s cubic-bezier(.2,.7,.2,1) both} .a2{animation:rise .8s .12s cubic-bezier(.2,.7,.2,1) both} .a3{animation:rise .8s .24s cubic-bezier(.2,.7,.2,1) both} .a4{animation:rise .8s .36s cubic-bezier(.2,.7,.2,1) both} .a5{animation:rise .8s .48s cubic-bezier(.2,.7,.2,1) both}
.zoomin{animation:zoom .9s .2s cubic-bezier(.2,.8,.2,1) both}

/* Signature : courbe de prévision */
.signal{margin-top:56px; position:relative}
.signal svg{display:block; width:100%; height:150px}
.signal .hist{fill:none; stroke:var(--ink); stroke-width:2.5; stroke-dasharray:1; stroke-dashoffset:1; animation:draw 2.6s .5s ease-out forwards}
.signal .fc{fill:none; stroke:var(--pri); stroke-width:3; stroke-dasharray:9 7; opacity:0; animation:fade .9s 2.9s forwards}
.signal .band{fill:var(--pri); opacity:0; animation:band .9s 2.9s forwards}
.signal .now{stroke:var(--line); stroke-width:1.5}
.signal .water{fill:var(--aqua); opacity:.14}
.signal .dot{fill:var(--pri); opacity:0; animation:fade .4s 2.8s forwards}
.sigcap{display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; font-size:13.5px; color:var(--muted); padding:10px 24px 0; max-width:1160px; margin:0 auto}
.sigcap b{color:var(--ink)} .sigcap .f{color:var(--pri); font-weight:700}

/* Section heads */
.head{display:grid; grid-template-columns:auto 1fr; gap:20px; align-items:end; margin-bottom:40px}
.head h2{font-size:clamp(2rem,4.6vw,3.1rem); font-weight:800}
.head .rule{height:2px; background:linear-gradient(90deg,var(--pri),var(--aqua),transparent); margin-bottom:14px; transform-origin:0 50%}
.head p{grid-column:1/-1; color:var(--muted); max-width:44em}

/* About */
.about{display:grid; grid-template-columns:1.3fr 1fr; gap:56px; align-items:start}
.about .big{font-family:var(--display); font-weight:500; font-size:clamp(1.25rem,2.2vw,1.6rem); line-height:1.45; color:var(--ink)}
.about p + p{margin-top:16px}
.facts{margin:0; background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:8px 24px}
.facts div{display:flex; justify-content:space-between; gap:16px; padding:14px 0; border-bottom:1px dashed var(--line)}
.facts div:last-child{border:0}
.facts dt{color:var(--muted); font-size:15px} .facts dd{margin:0; font-weight:700; color:var(--ink); text-align:right}
.stats{display:grid; grid-template-columns:repeat(3,1fr); margin-top:48px; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.stats div{padding:26px 24px; border-left:1px solid var(--line)}
.stats div:first-child{border-left:0; padding-left:0}
.stats b{display:block; font-family:var(--display); font-weight:800; font-size:clamp(2.6rem,6vw,4rem); line-height:1; color:var(--ink); font-variant-numeric:tabular-nums}
.stats b::after{content:"+"; color:var(--aqua); font-size:.55em; vertical-align:top; margin-left:2px}
.stats span{color:var(--muted)}

/* Projects */
.filters{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:28px}
.filters button{font:inherit; font-size:14.5px; font-weight:600; padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--text); cursor:pointer; transition:background .25s, color .25s, border-color .25s, transform .25s}
.filters button:hover{border-color:var(--pri); transform:translateY(-2px)}
.filters button[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:26px}
.proj{background:var(--surface); border:1px solid var(--line); border-radius:22px; overflow:hidden; display:flex; flex-direction:column; animation:cardIn .55s cubic-bezier(.2,.7,.2,1) both; transition:transform .35s, box-shadow .35s, border-color .35s}
.proj:hover{transform:translateY(-7px); box-shadow:var(--shadow); border-color:var(--pri)}
.proj.feat{grid-column:1/-1; flex-direction:row}
.proj.feat .art{flex:1.25; aspect-ratio:auto; min-height:340px}
.proj.feat .body{flex:1; justify-content:center; padding:36px}
.proj.feat h3{font-size:clamp(1.5rem,2.6vw,2rem)}
.art{position:relative; display:block; width:100%; padding:0; border:0; aspect-ratio:16/10; overflow:hidden; background:#EEF3FB; font:inherit}
button.art{cursor:zoom-in}
.art svg{display:block; width:100%; height:100%; transition:transform .6s}
.art img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:top center; opacity:0; transition:opacity .9s, transform .7s}
.art img.on{opacity:1}
.proj:hover .art img,.proj:hover .art svg{transform:scale(1.05)}
.zoomhint{position:absolute; top:12px; right:12px; display:flex; align-items:center; gap:6px; background:rgba(15,27,45,.85); color:#fff; font-size:12.5px; font-weight:600; padding:6px 11px; border-radius:999px; opacity:0; transform:translateY(-6px); transition:opacity .3s, transform .3s}
.proj:hover .zoomhint, button.art:focus-visible .zoomhint{opacity:1; transform:none}
.pips{position:absolute; left:0; right:0; bottom:10px; display:flex; justify-content:center; gap:6px}
.pips i{width:22px; height:4px; border-radius:4px; background:rgba(255,255,255,.75); box-shadow:0 0 0 1px rgba(0,0,0,.25); transition:background .3s}
.pips i.on{background:#2456E6}
.body{padding:20px 22px 22px; display:flex; flex-direction:column; gap:9px; flex:1}
.ctx{font-size:13px; font-weight:700; color:var(--aqua)}
.proj h3{font-size:1.2rem; font-weight:700}
.body p{font-size:15px}
.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:auto; padding-top:8px}
.tags span{font-size:12.5px; font-weight:600; padding:3px 10px; border-radius:8px; background:var(--soft); color:var(--ink)}
.count{color:var(--muted); font-size:14.5px; margin-bottom:16px}

/* Lightbox */
.lb{position:fixed; inset:0; z-index:60; background:rgba(6,10,20,.94); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px)); animation:fade .25s both}
.lb img{max-width:min(1100px,100%); max-height:72vh; object-fit:contain; border-radius:16px; background:#fff; animation:zoom .35s both}
.lb .cap{color:#fff; font-family:var(--display); font-weight:700; text-align:center}
.lb .cap small{display:block; font-family:var(--body); font-weight:400; opacity:.75}
.lb .ctrl{display:flex; gap:10px; flex-wrap:wrap; justify-content:center}
.lb button{font:inherit; font-size:15px; font-weight:700; padding:10px 20px; border-radius:12px; background:transparent; color:#fff; border:2px solid rgba(255,255,255,.7); cursor:pointer; transition:background .2s}
.lb button:hover{background:rgba(255,255,255,.15)}
.lb button.close{background:#2456E6; border-color:#2456E6}
.lb :focus-visible{outline-color:#fff}

/* Parcours */
.path{display:grid; grid-template-columns:1.2fr 1fr; gap:56px}
.path h3.sub{font-size:1.25rem; font-weight:700; margin-bottom:22px; display:flex; align-items:center; gap:10px; color:var(--ink)}
.path h3.sub svg{color:var(--pri)}
.tl{position:relative; padding-left:30px}
.tl::before{content:""; position:absolute; left:6px; top:8px; bottom:8px; width:2px; background:linear-gradient(var(--pri),var(--aqua))}
.step{position:relative; padding-bottom:30px}
.step::before{content:""; position:absolute; left:-30px; top:6px; width:14px; height:14px; border-radius:50%; background:var(--bg); border:3px solid var(--pri)}
.when{display:inline-block; font-size:13px; font-weight:700; color:var(--pri); background:var(--soft); padding:3px 10px; border-radius:8px; margin-bottom:8px}
.step h3{font-size:1.15rem; font-weight:700}
.org{font-weight:600; color:var(--ink); font-size:15px; margin-top:3px}
.step ul{margin:8px 0 0; padding-left:18px; font-size:15px}
.certs{list-style:none; margin:0; padding:0; background:var(--surface); border:1px solid var(--line); border-radius:22px; overflow:hidden}
.certs li{display:flex; justify-content:space-between; gap:14px; align-items:baseline; padding:14px 20px; border-bottom:1px solid var(--line); transition:background .25s, padding-left .25s}
.certs li:last-child{border:0}
.certs li:hover{background:var(--soft); padding-left:26px}
.certs strong{color:var(--ink); font-size:15px} .certs span{color:var(--muted); font-size:13.5px; white-space:nowrap}
.edu{background:linear-gradient(135deg,var(--pri),var(--aqua)); color:#fff; border-radius:22px; padding:24px; margin-bottom:26px}
.edu .when{background:rgba(255,255,255,.2); color:#fff} .edu h3{color:#fff; font-size:1.2rem} .edu p{font-size:15px; margin-top:6px; opacity:.95}

/* Skills */
.skills{display:grid; grid-template-columns:repeat(3,1fr); gap:22px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:24px; position:relative; overflow:hidden; transition:transform .35s, border-color .35s, box-shadow .35s}
.tile::before{content:""; position:absolute; left:0; top:0; height:4px; width:100%; background:linear-gradient(90deg,var(--pri),var(--aqua)); transform:scaleX(0); transform-origin:0 50%; transition:transform .45s}
.tile:hover{transform:translateY(-5px); border-color:var(--pri); box-shadow:var(--shadow)} .tile:hover::before{transform:none}
.tile.wide{grid-column:span 2}
.tile h3{font-size:1.1rem; font-weight:700; margin-bottom:14px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chips span{font-size:14px; font-weight:500; padding:5px 12px; border-radius:999px; border:1px solid var(--line); color:var(--text); transition:background .25s, color .25s, border-color .25s, transform .25s}
.chips span:hover{background:var(--pri); border-color:var(--pri); color:var(--pri-ink); transform:translateY(-2px)}
.langs{display:grid; gap:12px}
.langs div{display:grid; grid-template-columns:90px 1fr auto; gap:12px; align-items:center; font-size:14.5px}
.langs b{color:var(--ink)} .langs i{height:6px; border-radius:6px; background:var(--soft); overflow:hidden; display:block}
.langs i::after{content:""; display:block; height:100%; width:var(--w); background:linear-gradient(90deg,var(--pri),var(--aqua)); border-radius:6px; transform:scaleX(0); transform-origin:0 50%; transition:transform 1.2s .3s cubic-bezier(.2,.7,.2,1)}
.rv.in .langs i::after{transform:none}
.langs span{color:var(--muted); font-size:13.5px}

/* Contact */
.contact{margin-top:96px; background:var(--ink); color:var(--bg); border-radius:32px; padding:56px; display:grid; grid-template-columns:1fr 1.1fr; gap:48px; position:relative; overflow:hidden}
.contact::before{content:""; position:absolute; width:420px; height:420px; border-radius:50%; right:-140px; top:-180px; background:radial-gradient(closest-side, color-mix(in srgb, var(--aqua) 55%, transparent), transparent); pointer-events:none}
.contact > *{position:relative}
.contact h2{color:var(--bg); font-size:clamp(2rem,4.4vw,3rem); font-weight:800}
.contact p.t{margin:14px 0 28px; opacity:.82; max-width:28em}
.info{display:flex; gap:14px; align-items:center; text-decoration:none; color:var(--bg); padding:9px 0}
.info .ic{width:42px; height:42px; flex:none; border-radius:13px; background:color-mix(in srgb, var(--bg) 12%, transparent); display:grid; place-items:center; transition:background .25s, transform .25s}
a.info:hover .ic{background:var(--pri); color:var(--pri-ink); transform:rotate(-8deg)}
.info small{display:block; opacity:.65; font-size:13px} .info strong{font-size:15.5px; word-break:break-word}
.fields{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.fields textarea{grid-column:1/-1; resize:vertical}
.fields input,.fields textarea{width:100%; font:inherit; font-size:15px; padding:13px 14px; border-radius:13px; border:1.5px solid color-mix(in srgb, var(--bg) 25%, transparent); background:color-mix(in srgb, var(--bg) 8%, transparent); color:var(--bg); transition:border-color .25s}
.fields input:focus,.fields textarea:focus{border-color:var(--aqua); outline:none}
.fields ::placeholder{color:color-mix(in srgb, var(--bg) 55%, transparent)}
.status{font-size:14px; min-height:2.8em; padding-top:10px}
.status.err{color:#FF9B9B} .status.ok{color:#6FE3B4}
:root[data-theme="dark"] .status.err{color:#B3261E} :root[data-theme="dark"] .status.ok{color:#0B6E4F}
.contact .btn.solid{background:var(--bg); color:var(--ink); border-color:var(--bg)}
.contact :focus-visible{outline-color:var(--aqua)}
footer{padding:36px 24px calc(36px + env(safe-area-inset-bottom,0px)); text-align:center; color:var(--muted); font-size:14px}
.totop{position:fixed; right:20px; bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:30; width:44px; height:44px; border-radius:14px; border:0; background:var(--pri); color:var(--pri-ink); display:grid; place-items:center; cursor:pointer; box-shadow:var(--shadow); opacity:0; transform:translateY(16px); pointer-events:none; transition:opacity .3s, transform .3s}
.totop.show{opacity:1; transform:none; pointer-events:auto}

.rv{opacity:0; transition:opacity .8s ease, transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.up{transform:translateY(34px)} .rv.left{transform:translateX(-46px)} .rv.right{transform:translateX(46px)}
.rv.in{opacity:1; transform:none}
.rv .rule{transform:scaleX(0); transition:transform 1.1s .2s cubic-bezier(.2,.7,.2,1)} .rv.in .rule{transform:none}
@keyframes rise{from{opacity:0; transform:translateY(28px)}to{opacity:1; transform:none}}
@keyframes zoom{from{opacity:0; transform:scale(.88)}to{opacity:1; transform:none}}
@keyframes fade{to{opacity:1}} @keyframes band{to{opacity:.14}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes swap{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes pulse{50%{transform:scale(1.5); opacity:.6}}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--aqua) 70%, transparent)}100%{box-shadow:0 0 0 12px transparent}}
@keyframes cardIn{from{opacity:0; transform:translateY(24px) scale(.98)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important; animation-delay:0s!important; animation-iteration-count:1!important; transition-duration:.01ms!important}
  .rv{opacity:1; transform:none!important}
}
@media (max-width:980px){
  .grid{grid-template-columns:repeat(2,1fr)} .skills{grid-template-columns:repeat(2,1fr)}
  .proj.feat{flex-direction:column} .proj.feat .art{aspect-ratio:16/10; min-height:0; flex:none} .proj.feat .body{padding:22px}
  .path,.about,.contact{grid-template-columns:1fr; gap:36px}
